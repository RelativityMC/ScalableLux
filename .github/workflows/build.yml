name: build

on:
  push: {}
  pull_request: {}

permissions:
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: never
          cache-provider: basic

      - name: Build
        run: |
          ./gradlew clean build --stacktrace

      - name: upload to modrinth and curseforge
        run: ./gradlew publishMods
        if: github.ref == 'refs/heads/ver/26.3.0'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: 'build/libs/*.jar'

