pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "ScalableLux"

includeBuild('../FlowSched') {
    dependencySubstitution {
        substitute module('com.ishland.flowsched:flowsched') using project(':')
    }
}
